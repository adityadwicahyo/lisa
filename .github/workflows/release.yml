name: Release

# Merging into main releases a new version when the merge brings `feat` or `fix` commits (see scripts/release.py):
# the workflow commits the new version and CHANGELOG.md section to main, tags it, publishes the GitHub Release
# and moves develop forward to include it. Work pushed to develop never changes the version.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    # The workflow's own release commit doesn't start another release.
    if: "!startsWith(github.event.head_commit.message, 'chore(release): release ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # All tags and branches, to find the last release and update develop.

      - name: Decide the version
        id: release
        run: python3 scripts/release.py

      - name: Commit, tag and push
        if: steps.release.outputs.version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): release $VERSION" -m "BREAKING CHANGES:
          - Set \`__version__\` to $VERSION in \`lisa/__init__.py\` and add the $VERSION section to \`CHANGELOG.md\`."
          git tag -a "v$VERSION" -m "Lisa $VERSION"
          git push origin HEAD:main "v$VERSION"
          if git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:develop
          else
            echo "::notice::develop has commits that main doesn't; merge main into develop to pick up $VERSION."
          fi

      - name: Publish the GitHub Release
        if: steps.release.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: Lisa v${{ steps.release.outputs.version }}
          body_path: release-notes.md
